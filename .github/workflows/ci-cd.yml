name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PROJECT_DIR: '/${{ secrets.SERVER_USER }}/${{ secrets.PROJECT_DIR }}'

jobs:
  test:
    name: Test and Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test -- --run

      - name: Security Audit
        run: pnpm audit --audit-level high

      - name: Build Check
        env:
          VITE_SERVER_API_URL: ${{ secrets.VITE_SERVER_API_URL }}
          VITE_SERVER_API_PREFIX: ${{ secrets.VITE_SERVER_API_PREFIX }}
        run: pnpm run build

  build:
    name: Build Image and Push to GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            VITE_SERVER_API_URL=${{ secrets.VITE_SERVER_API_URL }}
            VITE_SERVER_API_PREFIX=${{ secrets.VITE_SERVER_API_PREFIX }}
            VITE_WS_URL=${{ secrets.VITE_WS_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.yml
          target: '${{ env.PROJECT_DIR }}'

      - name: Execute Remote Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            mkdir -p ${{ env.PROJECT_DIR }}
            cd ${{ env.PROJECT_DIR }}

            # Login and Pull
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            export DOCKER_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            docker pull $DOCKER_IMAGE

            # Create .env if missing
            if [ ! -f .env ]; then
              echo "VITE_SERVER_API_URL=${{ secrets.VITE_SERVER_API_URL }}" > .env
              echo "VITE_SERVER_API_PREFIX=${{ secrets.VITE_SERVER_API_PREFIX }}" >> .env
              echo "VITE_WS_URL=${{ secrets.VITE_WS_URL }}" >> .env
            fi

            # Deploy using the transferred docker-compose.yml
            docker compose up -d

            # Verification
            docker ps | grep foms-frontend

            # Cleanup
            docker image prune -af
